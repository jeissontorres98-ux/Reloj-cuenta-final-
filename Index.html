<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b17">
<title>¿Llegarás a tiempo?</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 80%,#4b2c1d 0%,#14172b 42%,#060812 100%)}
main{width:min(100%,680px);text-align:center;padding:clamp(8px,3vw,24px) 0}
.kicker{color:#f6c65b;text-transform:uppercase;letter-spacing:.22em;font-size:.78rem;font-weight:700}
h1{font-size:clamp(2.2rem,8vw,4.2rem);line-height:1.05;margin:14px 0 22px;font-weight:800}
.timer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;border:1px solid #eab849;border-radius:22px;padding:clamp(10px,3vw,20px);background:#050711cc;box-shadow:0 0 35px #f6b93b20}
.num{font-size:clamp(2.2rem,10vw,5rem);font-weight:800;line-height:1.1;letter-spacing:.02em;color:#ffd66e;text-shadow:0 0 18px #ffb51b70;font-variant-numeric:tabular-nums}
.unit{font-size:clamp(.65rem,2.3vw,.9rem);letter-spacing:.12em;text-transform:uppercase;color:#d7d9e8;margin-top:8px}
.goal{font-size:clamp(1.1rem,4vw,1.45rem);margin:22px 0 24px;color:#e5e7f3}
.question{font-size:clamp(1.5rem,5.7vw,2.5rem);font-weight:750;margin:0 0 12px}
.warning{font-size:clamp(1rem,3.5vw,1.3rem);line-height:1.5;color:#d9dbea;margin:0 auto;max-width:540px}
.footer{margin-top:32px;font-size:clamp(1.25rem,4.5vw,2rem);font-style:italic;font-weight:650;color:#ffd66e}
.small{margin-top:14px;color:#aeb3cd;font-size:.78rem}
@media(max-width:360px){body{padding:12px}.timer{gap:4px;padding:8px}.num{font-size:2rem}}
</style>
</head>
<body>
<main>
  <div class="kicker">El reloj no se detiene</div>
  <h1>Te quedan…</h1>
  <section class="timer" aria-label="Tiempo que queda hasta medianoche">
    <div><div class="num" id="hours">00</div><div class="unit">Horas</div></div>
    <div><div class="num" id="minutes">00</div><div class="unit">Minutos</div></div>
    <div><div class="num" id="seconds">00</div><div class="unit">Segundos</div></div>
  </section>
  <div class="goal">para cumplir tu objetivo.</div>
  <p class="question">¿Llegarás a tiempo?</p>
  <p class="warning">…… ¿O el tiempo se agotará sin cumplir el objetivo?</p>
  <div class="footer">El tiempo vuela, ¿no crees?</div>
  <div class="small" id="status">Cuenta regresiva en tiempo real hasta la medianoche local.</div>
</main>
<script>
(() => {
 const pad=n=>String(n).padStart(2,'0');
 function tick(){
   const now=new Date(), end=new Date(now);
   end.setHours(24,0,0,0);
   let s=Math.max(0,Math.floor((end-now)/1000));
   const h=Math.floor(s/3600); s%=3600;
   const m=Math.floor(s/60), sec=s%60;
   document.getElementById('hours').textContent=pad(h);
   document.getElementById('minutes').textContent=pad(m);
   document.getElementById('seconds').textContent=pad(sec);
   if(h===0&&m===0&&sec===0) document.getElementById('status').textContent='El día terminó. ¿Cumpliste tu objetivo?';
 }
 tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
